[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flashinfer-bench==0.1.2",
    "mcp>=2.0.0,<3",
    "pydantic>=2,<3",
    "sol-execbench",
    "torch==2.12.1",
]

[project.scripts]
kernel-tools-mcp = "kernel_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_tools"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
override-dependencies = ["torch==2.12.1"]

[tool.uv.sources]
sol-execbench = { git = "https://github.com/NVIDIA/SOL-ExecBench.git" }
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
